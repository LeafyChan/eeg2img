data:
  study:
    =replace=: true
    source:
      name: Xu2025Alljoined
    filter_stimuli:
      name: QueryEvents
      query: type != 'Image' or (label == 'stim_train' and subject in ['Xu2025Alljoined/2',
        'Xu2025Alljoined/4', 'Xu2025Alljoined/5', 'Xu2025Alljoined/6', 'Xu2025Alljoined/7',
        'Xu2025Alljoined/10', 'Xu2025Alljoined/11', 'Xu2025Alljoined/12', 'Xu2025Alljoined/14',
        'Xu2025Alljoined/15', 'Xu2025Alljoined/17', 'Xu2025Alljoined/19']) or (label
        == 'stim_test' and subject in ['Xu2025Alljoined/3', 'Xu2025Alljoined/8', 'Xu2025Alljoined/13',
        'Xu2025Alljoined/18'])
    split:
      name: PredefinedSplit
      test_split_query: label == 'stim_test'
      col_name: split
      valid_split_by: timeline
      valid_split_ratio: 0.2
      valid_random_state: 33
  summary_columns:
  - filepath
  neuro:
    frequency: 200.0
    filter:
    - 0.1
    - 55.0
    notch_filter:
    - 50.0
    - 60.0
    baseline:
    - 0.0
    - 0.2
    scaler: RobustScaler
    clamp: 20.0
  target:
    batch_size: 4
loss.temperature: true
loss.symmetric: true
trainer_config.n_epochs: 6
