data:
  study:
    =replace=: true
    source:
      name: Xu2024Alljoined
    split:
      name: SklearnSplit
      split_by: filepath
      valid_split_ratio: 0.2
      test_split_ratio: 0.2
      valid_random_state: 33
      test_random_state: 33
  summary_columns:
  - filepath
  neuro:
    frequency: 200.0
    filter:
    - 0.1
    - 55.0
    notch_filter:
    - 50.0
    - 60.0
    baseline:
    - 0.0
    - 0.2
    scaler: RobustScaler
    clamp: 20.0
  target:
    batch_size: 4
